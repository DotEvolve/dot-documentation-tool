version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.NPM_TOKEN}}

updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 3
    groups:
      dotevolve-packages:
        patterns:
          - '@dotevolve/*'
      npm-updates:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

name: Publish to NPM

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Remove GitHub Packages .npmrc
        run: rm -f .npmrc
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Determine dist-tag & publish to NPM
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -(beta|alpha|rc|canary) ]] || [[ "${{ github.ref }}" =~ refs/heads/release ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi
          echo "Checking if @dotevolve/documentation-tool@$VERSION already exists on public npm..."
          EXISTS_NPM=$(npm view "@dotevolve/documentation-tool@${VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)
          if [ "$EXISTS_NPM" = "$VERSION" ]; then
            echo "Version $VERSION is already published to public npm. Skipping publish."
          else
            echo "Publishing $VERSION with dist-tag: $TAG to public npm"
            npm publish --access public --tag "$TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Publish Package

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dotevolve'
      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Determine dist-tag & publish to GitHub Packages
        run: |
          AUTH_TOKEN="${GITHUB_TOKEN:-$NPM_TOKEN}"
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -(beta|alpha|rc|canary) ]] || [[ "${{ github.ref }}" =~ refs/heads/release ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi
          echo "Checking if @dotevolve/documentation-tool@$VERSION already exists on GitHub Packages..."
          EXISTS_GH=$(npm view "@dotevolve/documentation-tool@${VERSION}" version --registry=https://npm.pkg.github.com --//npm.pkg.github.com/:_authToken="${AUTH_TOKEN}" 2>/dev/null || true)
          if [ "$EXISTS_GH" = "$VERSION" ]; then
            echo "Version $VERSION is already published to GitHub Packages. Skipping publish."
          else
            echo "Publishing $VERSION with dist-tag: $TAG to GitHub Packages"
            npm publish --tag "$TAG" --//npm.pkg.github.com/:_authToken="${AUTH_TOKEN}"
          fi
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm-registry:
    name: Publish to Public NPM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
      - name: Remove GitHub Packages .npmrc
        run: rm -f .npmrc
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Determine dist-tag & publish to NPM
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -(beta|alpha|rc|canary) ]] || [[ "${{ github.ref }}" =~ refs/heads/release ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi
          echo "Checking if @dotevolve/documentation-tool@$VERSION already exists on public npm..."
          EXISTS_NPM=$(npm view "@dotevolve/documentation-tool@${VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)
          if [ "$EXISTS_NPM" = "$VERSION" ]; then
            echo "Version $VERSION is already published to public npm. Skipping publish."
          else
            echo "Publishing $VERSION with dist-tag: $TAG to public npm"
            npm publish --access public --tag "$TAG"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
